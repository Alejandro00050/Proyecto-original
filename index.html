<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- Permite que la aplicación se adapte correctamente a dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestor Escolar</title>
    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json">
    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
 
</head>

<body>

    <!--
        Contenedor principal de la aplicación.

        Las diferentes vistas serán cargadas dentro de este elemento
        mediante JavaScript.
    -->
    <main id="app"></main>

    <!--
        Punto de entrada de JavaScript.

        "type=module" nos permite utilizar import/export
        entre nuestros archivos JavaScript.
    -->
    <!--Cargamos el CDN de brypt para realizar el hash del password-->
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="./src/app.js"></script>


</body>

</html>
