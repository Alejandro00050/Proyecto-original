<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- Permite que la aplicación se adapte correctamente a dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestor Escolar</title>
    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json">
    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>

<body>

    <!--
        Contenedor principal de la aplicación.

        Las diferentes vistas serán cargadas dentro de este elemento
        mediante JavaScript.
    -->
    <main id="app"></main>

    <!--
        Punto de entrada de JavaScript.

        "type=module" nos permite utilizar import/export
        entre nuestros archivos JavaScript.
    -->
    <!--Cargamos el CDN de brypt para realizar el hash del password-->
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
    <script type="module" src="./src/app.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
</body>

</html>
